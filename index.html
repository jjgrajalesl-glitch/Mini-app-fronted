<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Mini App</title>
  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --btn: var(--tg-theme-button-color, #0088cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: center; background: #fff; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
    .price { font-weight: bold; color: green; margin: 8px 0; }
    button { background: var(--btn); color: var(--btn-text); border: none; padding: 8px 12px; border-radius: 6px; width: 100%; cursor: pointer; }
    .error-box { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="header">
    <h2 id="store-name">Cargando tienda...</h2>
  </div>

  <div id="error-container"></div>
  <div id="products-grid" class="grid"></div>

<script>
    // Configuración Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // Obtener Parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const storeId = urlParams.get('store_id') || urlParams.get('storeid') || 'demo_store';
    const PROJECT_ID = 'saas-miniapps-prod';

    let cart = [];

    // Cargar Tienda y Productos desde Firestore REST API
    async function loadStore() {
      try {
        const storeRes = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/stores/${storeId}`);
        const storeData = await storeRes.json();
        
        if (storeData.fields && storeData.fields.name) {
          document.getElementById('store-name').innerText = storeData.fields.name.stringValue;
        }

        const productsRes = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/stores/${storeId}/products`);
        const productsData = await productsRes.json();

        const container = document.getElementById('products-grid') || document.getElementById('products-container');
        if (container) container.innerHTML = '';

        if (!productsData.documents || productsData.documents.length === 0) {
          if (container) container.innerHTML = '<p style="grid-column:1/-1;text-align:center;">Esta tienda no tiene productos guardados aún.</p>';
          return;
        }

        productsData.documents.forEach(doc => {
          const p = doc.fields;
          const title = p.title ? p.title.stringValue : 'Producto';
          const price = p.price ? (p.price.doubleValue || p.price.integerValue) : 0;
          const image = p.image_url ? p.image_url.stringValue : 'https://via.placeholder.com/150';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${image}" alt="${title}">
            <h4>${title}</h4>
            <div class="price">$${price} USD</div>
            <button onclick="addToCart('${title}', ${price})">Agregar</button>
          `;
          if (container) container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function addToCart(title, price) {
      cart.push({ title, price });
      if (tg && tg.MainButton) {
        tg.MainButton.setText(`VER PEDIDO (${cart.length}) - $${cart.reduce((a,b)=>a+b.price,0)} USD`);
        tg.MainButton.show();
      } else {
        alert(`Añadido: ${title} - Total: $${cart.reduce((a,b)=>a+b.price,0)} USD`);
      }
    }

    // Handler de Cierre de Compra (Checkout)
    if (tg && tg.MainButton) {
      tg.MainButton.onClick(async () => {
        const total = cart.reduce((a,b)=>a+b.price, 0);
        const orderData = {
          store_id: storeId,
          items: cart.map(i => i.title).join(', '),
          total: total,
          user_name: tg.initDataUnsafe?.user?.first_name || 'Cliente'
        };

        tg.sendData(JSON.stringify(orderData));
        tg.close();
      });
    }

    loadStore();
  </script>
  
</body>
</html>
