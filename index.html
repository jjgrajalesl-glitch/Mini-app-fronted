<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Mini App</title>
  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --btn: var(--tg-theme-button-color, #0088cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: center; background: #fff; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
    .price { font-weight: bold; color: green; margin: 8px 0; }
    button { background: var(--btn); color: var(--btn-text); border: none; padding: 8px 12px; border-radius: 6px; width: 100%; cursor: pointer; }
    .error-box { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="header">
    <h2 id="store-name">Cargando tienda...</h2>
  </div>

  <div id="error-container"></div>
  <div id="products-grid" class="grid"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALopFJpPN6Zgjt4sP5U_UhhYB7hoNANIs",
      authDomain: "saas-miniapps-prod.firebaseapp.com",
      projectId: "saas-miniapps-prod",
      storageBucket: "saas-miniapps-prod.firebasestorage.app",
      messagingSenderId: "810701987603",
      appId: "1:810701987603:web:1c74cf63bb35a4730b84e6"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch(e) {
      showError("Error al inicializar Firebase: " + e.message);
    }

    const db = firebase.firestore();

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const storeId = urlParams.get('store_id') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || 'demo_store';

    let cart = [];

    function showError(msg) {
      document.getElementById('error-container').innerHTML = `<div class="error-box">${msg}</div>`;
    }

    async function loadStore() {
      try {
        const storeDoc = await db.collection('stores').doc(storeId).get();
        
        if (!storeDoc.exists) {
          document.getElementById('store-name').innerText = "Tienda No Encontrada";
          showError(`No existe el documento "${storeId}" en Firestore. Revisa que en la colección "stores" el ID sea exactamente "demo_store".`);
          return;
        }

        document.getElementById('store-name').innerText = storeDoc.data().name || "Mi Tienda";

        const snapshot = await db.collection('stores').doc(storeId).collection('products').get();
        const grid = document.getElementById('products-grid');
        grid.innerHTML = '';

        if (snapshot.empty) {
          showError("La tienda no tiene productos guardados aún.");
          return;
        }

        snapshot.forEach(doc => {
          const item = doc.data();
          grid.innerHTML += `
            <div class="card">
              <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.title}">
              <h4>${item.title || 'Producto'}</h4>
              <div class="price">$${item.price || 0} USD</div>
              <button onclick="addToCart('${doc.id}', '${item.title}', ${item.price})">Agregar</button>
            </div>
          `;
        });
      } catch (err) {
        document.getElementById('store-name').innerText = "Error de Conexión";
        showError("Error de Firestore: " + err.message);
      }
    }

    function addToCart(id, title, price) {
      cart.push({ id, title, price });
      if (tg && tg.MainButton) {
        tg.MainButton.text = `VER PEDIDO (${cart.length}) - $${cart.reduce((sum, i) => sum + i.price, 0)} USD`;
        tg.MainButton.show();
      } else {
        alert(`Producto agregado al carrito. Total: $${cart.reduce((sum, i) => sum + i.price, 0)} USD`);
      }
    }

    loadStore();
  </script>
</body>
</html>
